Categories:
  - Sports & Health
License: GPL-3.0-or-later
AuthorName: Ghassan Dabane
WebSite: https://dabane-ghassan.github.io/spur/
SourceCode: https://github.com/dabane-ghassan/spur
IssueTracker: https://github.com/dabane-ghassan/spur/issues
Changelog: https://github.com/dabane-ghassan/spur/releases
Donate: https://buymeacoffee.com/ghassandabane

AutoName: spur

RepoType: git
Repo: https://github.com/dabane-ghassan/spur.git

Builds:
  - versionName: 1.0.4
    versionCode: 5
    commit: v1.0.4
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.9
    rm:
      - selfhost
      - site
    prebuild:
      - sed -i -e '/signingConfig =/d' android/app/build.gradle.kts
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.4
CurrentVersionCode: 5
