#
# One-off helper: generates the Android build files Flutter normally creates
# (Gradle scripts, styles, launch screen), records the exact Flutter version,
# checks that a release build works, and commits the files to this branch.
name: Generate Android build files

on:
  push:
    branches: [android-files]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          # Pinned: F-Droid builds with the same Flutter (fdroid/io.github.dabaneghassan.spur.yml).
          flutter-version: 3.47.9
          channel: stable
      - name: Generate (if missing), render store screenshots, commit
        shell: bash
        run: |
          set -euo pipefail
          flutter --version --machine > tool/flutter-version.json
          if [ ! -f android/app/build.gradle.kts ]; then
            flutter create --org io.github.dabaneghassan --project-name spur --platforms android .
            git status --porcelain --untracked-files=all > tool/flutter-create-files.txt
          fi
          flutter pub get
          flutter test --update-goldens tool/screenshots
          shots=fastlane/metadata/android/en-US/images/phoneScreenshots
          rm -f "$shots"/*.png
          cp tool/screenshots/out/*.png "$shots"/
          ls -l "$shots"
          flutter build apk --release
          git config user.name "spur CI"
          git config user.email "ci@users.noreply.github.com"
          git add android tool "$shots" pubspec.lock
          [ -f .metadata ] && git add .metadata
          git commit -m "Generated Android build files and store screenshots [generated]" || echo "nothing new"
          git push origin HEAD:android-files
