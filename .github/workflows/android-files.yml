#
# One-off helper: generates the Android build files Flutter normally creates
# (Gradle scripts, styles, launch screen), records the exact Flutter version,
# checks that a release build works, and commits the files to this branch.
name: Generate Android build files

on:
  push:
    branches: [android-files]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate, build, commit
        shell: bash
        run: |
          set -euo pipefail
          flutter --version --machine > tool/flutter-version.json
          cat tool/flutter-version.json
          flutter create --org io.github.dabaneghassan --project-name spur --platforms android .
          git status --porcelain --untracked-files=all > tool/flutter-create-files.txt
          cat tool/flutter-create-files.txt
          flutter pub get
          flutter build apk --release
          ls -l build/app/outputs/flutter-apk/
          git config user.name "spur CI"
          git config user.email "ci@users.noreply.github.com"
          git add android tool/flutter-version.json tool/flutter-create-files.txt
          [ -f .metadata ] && git add .metadata
          git commit -m "Android build files generated by flutter create [generated]"
          git push origin HEAD:android-files
