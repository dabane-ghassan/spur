# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds the spur Android APK on GitHub's servers.
# Every change to the Android app on main publishes a test build
# (spur-test-build.apk on the "latest-build" pre-release); a new version in
# pubspec.yaml publishes a proper release.
# Changes to the website, the self-hosted web app, docs or other workflows
# don't rebuild the app.
name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Only what goes into the APK, its tests, store texts and this workflow.
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "fastlane/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # With these two repository secrets set, every build is signed with the same
      # spur key, so new versions install over old ones. Without them, builds use
      # a throwaway test key.
      HAS_KEY: ${{ secrets.SPUR_KEYSTORE_BASE64 != '' && secrets.SPUR_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Pinned: F-Droid builds with the same Flutter (fdroid/io.github.dabaneghassan.spur.yml).
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Build, test and package
        shell: bash
        run: |
          set -o pipefail
          {
            echo "== flutter --version"; flutter --version
            echo "== flutter pub get"; flutter pub get
            echo "== flutter analyze"; flutter analyze --no-fatal-infos
            echo "== flutter test"; flutter test
            echo "== flutter build apk"; flutter build apk --release
          } 2>&1 | tee build-log.txt
          cp build/app/outputs/flutter-apk/app-release.apk spur.apk

      - name: Sign with the spur release key
        if: env.HAS_KEY == 'true'
        shell: bash
        env:
          KS_B64: ${{ secrets.SPUR_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SPUR_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/spur.jks"' EXIT
          printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/spur.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "apksigner from $BT"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/spur.jks" --ks-key-alias spur \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out spur.apk build/app/outputs/flutter-apk/app-release.apk
          # verify fails the step if the signature is bad. The certificate lines are only
          # printed for the log; their wording differs between build-tools versions.
          "$BT/apksigner" verify --verbose --print-certs spur.apk > verify.txt
          grep -E "Verifies|certificate (DN|SHA-256)" verify.txt || cat verify.txt

      # On failure, keep the full log on a "ci-log" branch so it can be read with plain git.
      - name: Save the build log
        if: failure()
        shell: bash
        run: |
          [ -f build-log.txt ] || echo "No log was written; see the Actions page." > build-log.txt
          mkdir -p /tmp/ci-log && cp build-log.txt /tmp/ci-log/
          cd /tmp/ci-log
          git init -q -b ci-log
          git config user.name "spur CI"
          git config user.email "ci@users.noreply.github.com"
          git add build-log.txt
          git commit -qm "Build log for ${GITHUB_SHA::7} (failed)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log

      # The test build is called spur-test-build.apk, so that spur.apk only ever means
      # the latest real release (releases/latest/download/spur.apk on the website).
      - name: Prepare test build
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp spur.apk spur-test-build.apk
          gh release delete-asset latest-build spur.apk --yes 2>/dev/null || true

      - name: Publish test build
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest test build
          prerelease: true
          make_latest: false
          files: spur-test-build.apk
          body: |
            Test build of `${{ github.sha }}`, made automatically from the main branch. Not a release: for everyday use, get the [latest release](https://github.com/${{ github.repository }}/releases/latest).
            ${{ env.HAS_KEY == 'true' && 'Signed with the spur release key, so it installs over earlier test builds.' || 'Signed with a throwaway test key: uninstall the previous build before installing this one.' }}
            F-Droid signs its own builds, so switching to F-Droid later needs one uninstall.

      # A release is made for a pushed tag, or on main when pubspec.yaml has a
      # version that has no release yet (bump the version, push, done).
      - name: Is this a release?
        id: rel
        if: success()
        shell: bash
        run: |
          ver=$(sed -nE 's/^version: *([^+ ]+)\+.*/\1/p' pubspec.yaml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && ! git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null; then
            echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        if: success() && steps.rel.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          code=$(sed -nE 's/^version: *[^+]+\+([0-9]+).*/\1/p' pubspec.yaml)
          cp spur.apk "spur-${TAG}.apk"
          {
            echo "## What's new"
            echo
            sed 's/^• /- /' "fastlane/metadata/android/en-US/changelogs/${code}.txt" 2>/dev/null || echo "See the commits since the last release."
            echo
            if [ -f "selfhost/changelog/${TAG}.md" ]; then
              echo "## Self-hosted web app"
              echo
              cat "selfhost/changelog/${TAG}.md"
              echo
            fi
            echo "## Install"
            echo
            echo "Download **spur-${TAG}.apk** below on your Android phone (Android 7.0 or newer), open it and allow your browser to install it."
            echo "spur asks for no permissions and has no internet access. Both APKs below are the same file."
            echo
            echo "To be told about new versions, add spur to [Obtainium](https://obtainium.imranr.dev/) with the badge in the [README](https://github.com/${GITHUB_REPOSITORY}#readme)."
            echo
            echo "Self-hosting the web app instead? See [selfhost/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/selfhost/README.md)."
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        if: success() && steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: spur ${{ steps.rel.outputs.tag }}
          body_path: release-notes.md
          # spur-vX.Y.Z.apk for people and Obtainium; spur.apk so that
          # releases/latest/download/spur.apk always gives the newest version.
          files: |
            spur-${{ steps.rel.outputs.tag }}.apk
            spur.apk
          prerelease: false
          make_latest: true

      - name: Remove an old failure log
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        run: git push origin --delete ci-log 2>/dev/null || true
