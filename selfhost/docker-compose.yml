#
# spur self-hosted
#   cp .env.example .env      # adjust if you like
#   docker compose up -d      # then open http://<your-server>:4219
#
# For HTTPS with your own domain (needed to install spur as an app on phones),
# add the Caddy file:
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d

services:
  spur:
    build: .
    image: spur:latest
    container_name: spur
    restart: unless-stopped
    ports:
      - "${SPUR_PORT:-4219}:4219"
    environment:
      SPUR_ALLOW_SIGNUP: ${SPUR_ALLOW_SIGNUP:-false}
      SPUR_TRUST_PROXY: ${SPUR_TRUST_PROXY:-false}
      SPUR_COOKIE_SECURE: ${SPUR_COOKIE_SECURE:-auto}
      SPUR_SESSION_DAYS: ${SPUR_SESSION_DAYS:-90}
      TZ: ${TZ:-UTC}
    volumes:
      - spur-data:/data
    # Hardening: spur only ever writes to /data.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  spur-data:
